<script>
/* ══ 密碼保護（115.11.20）：所有連到 Google 後台的請求都自動帶上密碼 ══ */
(function(){
  var KEY='cust_lookup_pw';            // 和「客戶資料查詢」共用，登入一次全部記住
  var origFetch=window.fetch.bind(window);
  var waiting=null;
  function getPw(){try{return localStorage.getItem(KEY)||'';}catch(e){return'';}}
  function setPw(v){try{if(v)localStorage.setItem(KEY,v);else localStorage.removeItem(KEY);}catch(e){}}
  function askPw(msg){
    if(waiting)return waiting;
    waiting=new Promise(function(resolve){
      function build(){
        var o=document.createElement('div');
        o.style.cssText='position:fixed;inset:0;background:rgba(4,90,88,0.55);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;';
        o.innerHTML='<div style="background:#fff;border-radius:22px;padding:24px 22px;width:100%;max-width:340px;text-align:center;font-family:\'Comic Sans MS\',\'Chalkboard SE\',cursive;">'
          +'<div style="font-size:34px;">🔒</div><div style="font-size:19px;font-weight:600;color:#077B78;margin:6px 0 4px;">請輸入密碼</div>'
          +'<div id="pwg-msg" style="font-size:14px;color:#B03030;min-height:20px;margin-bottom:8px;">'+(msg||'')+'</div>'
          +'<input id="pwg-in" type="password" placeholder="密碼" style="width:100%;font-size:17px;border:1.5px solid #D4F0EE;border-radius:14px;padding:10px 13px;background:#F0FAFA;outline:none;margin-bottom:12px;">'
          +'<button id="pwg-btn" style="width:100%;padding:11px;font-size:17px;font-weight:600;border:none;border-radius:16px;background:#0ABAB5;color:#fff;font-family:inherit;">確定</button>'
          +'<div style="font-size:12px;color:#999;margin-top:10px;">這台裝置會記住密碼</div></div>';
        document.body.appendChild(o);
        var inp=o.querySelector('#pwg-in');
        function ok(){var v=inp.value.trim();if(!v)return;setPw(v);o.remove();waiting=null;resolve(v);}
        o.querySelector('#pwg-btn').onclick=ok;
        inp.onkeydown=function(e){if(e.key==='Enter')ok();};
        setTimeout(function(){inp.focus();},100);
      }
      if(document.body)build();else document.addEventListener('DOMContentLoaded',build);
    });
    return waiting;
  }
  function addPw(input,init,pw){
    var url=String(input);
    init=init?Object.assign({},init):{};
    if(init.method&&init.method.toUpperCase()==='POST'&&typeof init.body==='string'){
      try{var b=JSON.parse(init.body);b.pw=pw;init.body=JSON.stringify(b);}catch(e){}
    }else{
      url+=(url.indexOf('?')>-1?'&':'?')+'pw='+encodeURIComponent(pw);
    }
    return [url,init];
  }
  window.fetch=async function(input,init){
    if(String(input).indexOf('script.google.com')<0)return origFetch(input,init);
    for(var tries=0;tries<5;tries++){
      var pw=getPw()||await askPw('');
      var a=addPw(input,init,pw);
      var res=await origFetch(a[0],a[1]);
      if(res.type==='opaque')return res;
      try{
        var d=await res.clone().json();
        if(d&&d.status==='error'&&d.msg==='密碼錯誤'){setPw('');await askPw('密碼錯誤，請重新輸入');continue;}
      }catch(e){}
      return res;
    }
    return res;
  };
})();
</script>

<script>
var API='https://script.google.com/macros/s/AKfycbySxON3T6IRcZEiM3Eb2WtACMciP1eM_rF11emksjvHgUKIOr8JYqoGl5gJfZO7c2OxBA/exec';
var recs=[],curFilter='all';
function fmtDate(d){
  if(!d) return '－';
  try{
    var s=String(d);
    if(s.indexOf('GMT')!==-1||s.indexOf('00:00:00')!==-1){
      var dt=new Date(s);
      var y=dt.getFullYear();
      var m=String(dt.getMonth()+1).padStart(2,'0');
      var day=String(dt.getDate()).padStart(2,'0');
      return y+'-'+m+'-'+day;
    }
    return s.substring(0,10);
  }catch(e){return String(d).substring(0,10);}
}
var TYPE_MSG={
  '儲蓄險到期':'您好！您的儲蓄險保單即將到期，請問您有收到保險公司的通知了嗎？\n\n到期後您可以選擇：\n1. 領回滿期金\n2. 轉入其他保單\n\n需要提供的文件：\n・身分證正本\n・原保單\n・存摺封面\n\n請問您方便什麼時候來辦理呢？',
  '生存年金可申請':'您好！您的生存年金已到達可申請日期 🎉\n\n申請方式：\n1. 臨櫃辦理\n2. 填寫申請書郵寄\n\n需要準備的文件：\n・身分證正本\n・存摺封面\n・印章\n\n請問您需要我協助安排辦理事宜嗎？',
  '信用卡效期到期':'您好！您的信用卡即將到期，保費自動扣款可能會受到影響。\n\n請確認：\n1. 是否已收到新卡\n2. 啟用新卡後，請通知我更新保費扣款資料\n\n如需更換扣款信用卡，請提供：\n・新卡銀行名稱\n・新卡有效年月\n\n請問您的新卡是否已經收到了呢？'
};
function setSb(t,m){var b=document.getElementById('sb');b.className='sb '+t;b.textContent=m;}
function sw(t){
  document.querySelectorAll('.tab').forEach(function(e,i){e.classList.toggle('on',['input','list','pay'][i]===t);});
  document.querySelectorAll('.pnl').forEach(function(e){e.classList.remove('on');});
  document.getElementById('pnl-'+t).classList.add('on');
  if(t==='list') rendList();
  if(t==='pay') rendPay();
}
function updType(){

// ════════ 保單扣款 ════════
function p2(n){ return ('0' + n).slice(-2); }
var FREQ_MONTHS = {'年繳':12, '半年繳':6, '季繳':3, '月繳':1};
function pd(s){ var m = String(s || '').match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function ymd(d){ return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function md(d){ return d.getFullYear() + '/' + p2(d.getMonth() + 1) + '/' + p2(d.getDate()); }
function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function dayDiff(a, b){ return Math.round((b - a) / 864e5); }
function monthShift(a, n){
  var y = a.getFullYear(), m = a.getMonth() + n;
  var last = new Date(y, m + 1, 0).getDate();
  return new Date(y, m, Math.min(a.getDate(), last));
}
// 「after」之後的第一個扣款日
function nextPayAfter(anchorStr, freq, after){
  var a = pd(anchorStr), step = FREQ_MONTHS[freq];
  if (!a || !step) return null;
  var diff = (after.getFullYear() - a.getFullYear()) * 12 + (after.getMonth() - a.getMonth());
  var k = Math.floor(diff / step) - 1, d = monthShift(a, k * step);
  while (d <= after) { k++; d = monthShift(a, k * step); }
  return d;
}
// 規則：第一次＝扣款日前 60 天；第二次＝扣款日前 40 天（不早於卡片到期月 1 號）；之後每 7 天
function payPlan(r, today){
  if (r.method === '帳戶扣款') return null;
  var m = String(r.cardExp || '').match(/^(\d{4})-(\d{1,2})/);
  if (!m) return null;
  var end = new Date(+m[1], +m[2], 0), mStart = new Date(+m[1], +m[2] - 1, 1);
  var D = nextPayAfter(r.payDate, r.freq, end), noInfo = false;
  if (!D) { D = addDays(end, 1); noInfo = true; }           // 沒填扣款日：以卡片到期日為準
  var first = addDays(D, -60), sec = addDays(D, -40);
  if (sec < mStart) sec = mStart;
  var left = dayDiff(today, D);
  var stage = today < first ? 0 : (today < sec ? 1 : 2);
  return {D:D, first:first, second:sec, left:left, stage:stage, noInfo:noInfo,
          urgent: stage > 0 && left < 30 && left >= 0, overdue: left < 0};
}

function rendPay(){
  if(!$('plist'))return;
  var T=todayD(),q=$('p-q').value.trim(),by={},order=[];
  pays.forEach(function(p){if(!by[p.name]){by[p.name]=[];order.push(p.name);}by[p.name].push(p);});
  var items=order.map(function(n){
    var list=by[n],min=1e9,stage=0;
    list.forEach(function(p){var pl=payPlan(p,T);if(pl&&pl.stage>0){stage=Math.max(stage,pl.stage);min=Math.min(min,pl.left);}});
    return{name:n,list:list,min:min,stage:stage};
  }).filter(function(c){
    if(q&&c.name.indexOf(q)<0&&!c.list.some(function(p){return p.policy.indexOf(q)>-1;}))return false;
    if(payF==='now'&&!c.stage)return false;
    if(payF==='miss'&&!c.list.some(function(p){return!p.payDate||!p.freq;}))return false;
    return true;
  }).sort(function(a,b){return(b.stage>0)-(a.stage>0)||a.min-b.min||a.name.localeCompare(b.name);});
  if(!items.length){$('plist').innerHTML='<div class="emp">'+(pays.length?'沒有符合的保單':'還沒有保單扣款資料，按「＋ 新增保單」開始')+'</div>';return;}

    var nm=esc(c.name);

      +'<div style="display:flex;justify-content:space-between;align-items:center;"><span class="rn">'+nm+'</span>'
      +'<button class="cb" style="margin:0" onclick="openPay(null,\''+nm+'\')">＋ 保單</button></div>'
      +gk.map(function(k){var f=groups[k][0];
        return '<div class="cg"><div class="cg-h">'+(k==='帳戶扣款'?'🏦 帳戶扣款':'💳 '+esc(f.bank||'未填銀行')+' 末四碼'+esc(f.card4||'－')+'｜'+(f.cardExp?f.cardExp.replace('-','/')+' 到期':'未填效期'))+'</div>'
          +groups[k].map(function(p){return policyLine(p,T);}).join('')+'</div>';}).join('')
      +'<button class="done-btn" onclick="openCard(\''+nm+'\')">💳 勾選的保單換新卡</button>'
      +(c.stage?'<button class="cb" onclick="togPayMsg(this,\''+nm+'\')">產出客戶訊息</button><div class="msg-box"></div>':'')
      +'</div>';

  if(d.method==='信用卡'&&!d.cardExp)miss.push('・卡片有效年月');
  if(!editPolicy||editPolicy!==d.policy){if(pays.some(function(p){return p.policy===d.policy;}))miss.push('・保單號碼「'+d.policy+'」已經存在');}
  if(miss.length){var e=$('pf-err');e.innerHTML='⚠️ 請確認：<br>'+miss.join('<br>');e.style.display='block';return;}
  var btn=$('pf-save');btn.disabled=true;btn.textContent='儲存中...';setSb('sl2','儲存至 Google Sheets...');
  try{await post(d);await loadPay();setSb('sok','已儲存 ✅');closeForms();}
  catch(e){setSb('ser','儲存失敗，請重試');}
  btn.disabled=false;btn.textContent='儲存';
}
async function delPay(){
  if(!editPolicy||!confirm('確定刪除保單「'+editPolicy+'」的扣款資料？'))return;
  setSb('sl2','刪除中...');
  try{await post({action:'pay_delete',policy:editPolicy});await loadPay();setSb('sok','已刪除');closeForms();}
  catch(e){setSb('ser','刪除失敗');}
}
function togCfMethod(){var acct=$('cf-method').value==='帳戶扣款';$('cf-expwrap').style.display=acct?'none':'block';$('cf-card4-l').textContent=acct?'帳號末四碼':'卡號末四碼';}
function openCard(name){
  var sel=[].slice.call(document.querySelectorAll('.pchk:checked')).filter(function(c){return c.dataset.name===name;}).map(function(c){return c.value;});
  if(!sel.length){alert('請先勾選「'+name+'」要換卡的保單');return;}
  closeForms();cardPolicies=sel;
  $('cf-list').innerHTML='<b>'+esc(name)+'</b>　要換卡的保單（'+sel.length+' 張）：<br>'+sel.map(function(pol){var p=pays.filter(function(x){return x.policy===pol;})[0];return'・'+esc(p.company)+' '+esc(pol);}).join('<br>');
  $('cf-method').value='信用卡';$('cf-bank').value='';$('cf-card4').value='';$('cf-cardexp').value='';togCfMethod();
  $('card-form').style.display='block';$('card-form').scrollIntoView({behavior:'smooth',block:'start'});
}
async function saveCard(){
  var d={action:'pay_card',policies:cardPolicies,method:$('cf-method').value,bank:$('cf-bank').value.trim(),card4:$('cf-card4').value.trim(),cardExp:$('cf-cardexp').value};
  if(d.method==='信用卡'&&(!d.card4||!d.cardExp)){alert('請填寫新卡的末四碼和有效年月');return;}
  var btn=$('cf-save');btn.disabled=true;btn.textContent='儲存中...';setSb('sl2','儲存至 Google Sheets...');
  try{await post(d);await loadPay();setSb('sok','已換卡 ✅，並已新增服務記錄');closeForms();}
  catch(e){setSb('ser','儲存失敗，請重試');}
  btn.disabled=false;btn.textContent='儲存';
}
initDates();loadR().then(loadPay);
</script>
