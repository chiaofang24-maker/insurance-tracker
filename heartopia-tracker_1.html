<style>
:root {

  --muted: #8B7040;
  --accent: #8B6310;
  --accent-fg: #FFFFFF;
  --done-bg: #EEF7E8;
  --done-border: #8DC97A;
  --done-text: #2D6B1A;
  --gap-color: #C45C08;
  --chip-bg: #F5EAC8;
  --chip-on: #8B6310;
  --chip-on-fg: #FFFFFF;
  --r: 14px;
  --rs: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1A0C; --surface: #28230F; --surface-2: #332C14;
    --border: #4A3E1E; --text: #F0E0B0; --muted: #A08C50;
    --accent: #C49A28; --accent-fg: #1E1A0C;
    --done-bg: #0F1E0A; --done-border: #3A7030; --done-text: #6CC45A;
    --gap-color: #E8854A;
    --chip-bg: #2A2410; --chip-on: #C49A28; --chip-on-fg: #1E1A0C;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1A0C; --surface: #28230F; --surface-2: #332C14;
  --border: #4A3E1E; --text: #F0E0B0; --muted: #A08C50;
  --accent: #C49A28; --accent-fg: #1E1A0C;
  --done-bg: #0F1E0A; --done-border: #3A7030; --done-text: #6CC45A;
  --gap-color: #E8854A;
  --chip-bg: #2A2410; --chip-on: #C49A28; --chip-on-fg: #1E1A0C;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Serif TC',Georgia,serif;background:var(--bg);color:var(--text);min-height:100svh;-webkit-text-size-adjust:100%;font-size:16px}

/* ── Sticky header ── */
.hd{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--border);padding:1rem 1rem 0}
.hd-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem;gap:.5rem}
.hd-title{font-family:'Noto Serif TC',Georgia,serif;font-size:1.5rem;font-weight:400;color:var(--accent);white-space:nowrap;flex:1}
.hd-right{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.hd-stat{font-size:.875rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hd-stat strong{color:var(--text);font-weight:600}
/* Search button */
.srch-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--chip-bg);border:1px solid var(--border);border-radius:50%;cursor:pointer;-webkit-tap-highlight-color:transparent;font-size:1rem;color:var(--accent);transition:background .15s}
.srch-btn:active{background:var(--border)}
.prog-bar{height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:.75rem}
.prog-fill{height:100%;background:var(--done-text);border-radius:99px;transition:width .4s ease}
.cat-row{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.875rem;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cat-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:.45rem .9rem;background:var(--chip-bg);border:1px solid var(--border);border-radius:99px;font-size:.9rem;font-weight:400;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap;transition:background .15s,color .15s,border-color .15s;font-family:'Noto Serif TC',Georgia,serif}
.chip.on{background:var(--chip-on);color:var(--chip-on-fg);border-color:var(--chip-on)}

/* ── Search panel (ingredient picker) ── */
.srch-panel{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.srch-panel.open{display:flex;align-items:flex-end}
.srch-sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-height:88svh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.srch-bar{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1rem .6rem;border-bottom:1px solid var(--border)}
.srch-bar h2{font-size:1.1rem;font-weight:500;color:var(--accent)}
.srch-close{height:36px;padding:0 .9rem;background:var(--chip-bg);border:1px solid var(--border);border-radius:99px;font-size:.9rem;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent}
/* ingredient chip grid */
.ing-grid{overflow-y:auto;padding:.75rem 1rem;display:flex;flex-wrap:wrap;gap:.45rem;-webkit-overflow-scrolling:touch}
.ing-sel-chip{padding:.5rem .85rem;background:var(--chip-bg);border:1.5px solid var(--border);border-radius:99px;font-size:.95rem;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap;transition:background .12s,color .12s,border-color .12s;font-family:'Noto Serif TC',Georgia,serif}
.ing-sel-chip.active{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
/* results */
.srch-results{padding:.5rem 1rem .75rem;overflow-y:auto;flex:1;min-height:0}
.srch-divider{font-size:.75rem;font-weight:600;color:var(--muted);letter-spacing:.04em;margin:.5rem 0 .4rem;text-transform:uppercase}
.srch-total-row{background:var(--accent);color:var(--accent-fg);border-radius:var(--rs);padding:.65rem 1rem;font-size:1rem;font-weight:600;margin-bottom:.6rem;display:flex;justify-content:space-between}
.srch-item{display:flex;justify-content:space-between;align-items:center;padding:.55rem .8rem;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--rs);margin-bottom:.35rem;font-size:.9rem}
.srch-item .sname{color:var(--text);flex:1}
.srch-item .sqty{font-weight:600;color:var(--gap-color);font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:.5rem}
.srch-item.done-item .sname{color:var(--done-text)}
.srch-item.done-item .sqty{color:var(--done-text);font-weight:400}

/* ── List ── */
.list{padding:.5rem 1rem 6rem;display:flex;flex-direction:column;gap:.5rem;max-width:520px;margin:0 auto}

/* ── Card (accordion) ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.card.done{background:var(--done-bg);border-color:var(--done-border)}

/* Collapsed header row — always visible, tap to toggle */
.card-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.9rem 1rem;min-height:54px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.cname{font-family:'Noto Serif TC',Georgia,serif;font-size:1.1rem;font-weight:400;color:var(--text);line-height:1.3;flex:1}
.head-right{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.ctarget{font-size:.85rem;color:var(--muted);white-space:nowrap}
.chevron{font-size:.85rem;color:var(--muted);transition:transform .2s;display:inline-block}
.card.open .chevron{transform:rotate(180deg)}

/* Expandable body */
.card-body{display:none;padding:0 1rem 1rem;border-top:1px solid var(--border)}
.card.open .card-body{display:block}

.ing-row{display:flex;flex-wrap:wrap;gap:.35rem;margin:.7rem 0}
.ichip{font-size:.85rem;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:.2rem .5rem;white-space:nowrap}

/* Controls */
.ctrl-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem}
.clabel{font-size:.875rem;color:var(--muted);white-space:nowrap}
.cinp{height:44px;background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--rs);font-family:'Noto Serif TC',Georgia,serif;font-size:1.2rem;font-weight:400;font-variant-numeric:tabular-nums;color:var(--text);text-align:center;-webkit-appearance:none;appearance:none;outline:none;width:100px}
.cinp:focus{border-color:var(--accent)}

/* Result rows */
.res{display:flex;flex-direction:column;gap:.45rem;margin-top:.5rem}
.res-row{display:flex;align-items:baseline;gap:.5rem}
.rlabel{font-size:.8rem;font-weight:500;color:var(--muted);white-space:nowrap;min-width:56px;flex-shrink:0}
.rval{font-size:.9rem;color:var(--text);line-height:1.4}
.rval.gap-num{font-family:'Noto Serif TC',Georgia,serif;font-size:1.35rem;font-weight:400;color:var(--gap-color);font-variant-numeric:tabular-nums}
.rval.mat-txt{color:var(--muted);font-size:.85rem;word-break:break-all}

/* Done state */
.done-badge{font-size:.85rem;font-weight:600;color:var(--done-text);background:var(--done-bg);border:1px solid var(--done-border);border-radius:99px;padding:.2rem .6rem;white-space:nowrap}
</style>

try { counts = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(counts)); } catch(e){} };

// ── Helpers ────────────────────────────────────────────
function parseIng(str) {
  return str.split('、').map(s => {
    const m = s.trim().match(/^(.+?)\*(\d+)$/);
    return m ? {name:m[1].trim(), qty:parseInt(m[2])} : {name:s.trim(), qty:1};
  });
}

function fmtMats(ingStr, gap) {
  if (gap <= 0) return '';
  return parseIng(ingStr).map(i => `${i.name}×${i.qty * gap}`).join('、');
}

function getC(id) { return counts[id] || 0; }

function setC(id, val, target) {
  const v = Math.min(Math.max(parseInt(val) || 0, 0), target);
  counts[id] = v; save(); return v;
}

let activeCat = '全部';
let openId = null;

// ── Render ─────────────────────────────────────────────
function renderHeader() {
  const done = RECIPES.filter(r => getC(r.id) >= r.target).length;
  document.getElementById('sDone').textContent = done;
  document.getElementById('sTotal').textContent = RECIPES.length;
  document.getElementById('oFill').style.width = (done / RECIPES.length * 100) + '%';
}

function renderCats() {
  const cats = ['全部', ...new Set(RECIPES.map(r => r.cat))];
  document.getElementById('cats').innerHTML = cats.map(c => {
    const sub = c === '全部' ? RECIPES : RECIPES.filter(r => r.cat === c);
    const d = sub.filter(r => getC(r.id) >= r.target).length;
    return `<button class="chip${c===activeCat?' on':''}" data-cat="${c}">${c} ${d}/${sub.length}</button>`;
  }).join('');
}

function cardHTML(r, isOpen) {
  const c = getC(r.id), gap = Math.max(r.target - c, 0), done = gap === 0;
  const ings = parseIng(r.ing);
  const ingChips = ings.map(i => `<span class="ichip">${i.name}${i.qty>1?'×'+i.qty:''}</span>`).join('');
  const mats = fmtMats(r.ing, gap);

  return `<div class="card${done?' done':''}${isOpen?' open':''}" id="card-${r.id}">
    <div class="card-head" data-id="${r.id}">
      <span class="cname">${r.name}</span>
      <div class="head-right">
        ${done ? '<span class="done-badge">✓ 達標</span>' : `<span class="ctarget">還差 ${gap}</span>`}
        <span class="chevron">▾</span>
      </div>
    </div>
    <div class="card-body">
      <div class="ing-row">${ingChips}</div>
      <div class="ctrl-row">
        <span class="clabel">目前數量</span>
        <input class="cinp" type="number" inputmode="numeric"
          data-id="${r.id}" data-t="${r.target}" value="${c}" min="0" max="${r.target}">
      </div>
      ${done
        ? `<div style="font-size:.9rem;color:var(--done-text);padding:.25rem 0">✓ 已達標精通！</div>`
        : `<div class="res">
            <div class="res-row">
              <span class="rlabel">達標差額</span>
              <span class="rval gap-num" id="gap-${r.id}">${gap} 份</span>
            </div>
            <div class="res-row">
              <span class="rlabel">還需材料</span>
              <span class="rval mat-txt" id="mat-${r.id}">${mats}</span>
            </div>
          </div>`
      }
    </div>
  </div>`;
}

function renderList() {
  const filtered = activeCat === '全部' ? RECIPES : RECIPES.filter(r => r.cat === activeCat);
  const inc  = filtered.filter(r => getC(r.id) < r.target);
  const done = filtered.filter(r => getC(r.id) >= r.target);
  document.getElementById('list').innerHTML = [...inc, ...done].map(r => cardHTML(r, r.id === openId)).join('');
}

function renderAll() { renderHeader(); renderCats(); renderList(); }

// Partial update (avoid full re-render when state doesn't flip)
function updateCard(id, target) {
  const c = getC(id), gap = Math.max(target - c, 0);
  const gapEl = document.getElementById('gap-'+id);
  const matEl = document.getElementById('mat-'+id);
  if (gapEl) gapEl.textContent = gap + ' 份';
  if (matEl) {
    const r = RECIPES.find(x => x.id === id);
    matEl.textContent = fmtMats(r.ing, gap);
  }
  const wasDone = document.getElementById('card-'+id)?.classList.contains('done');
  const nowDone = gap === 0;
  if (wasDone !== nowDone) renderAll();
  else { renderHeader(); renderCats(); }
}

// ── Events ─────────────────────────────────────────────
document.addEventListener('click', e => {
  // Category chip
  if (e.target.matches('.chip')) {
    activeCat = e.target.dataset.cat;
    openId = null;
    renderAll();
    return;
  }
  // Card header toggle
  const head = e.target.closest('.card-head');
  if (head && !e.target.matches('.cinp')) {
    const id = head.dataset.id;
    openId = openId === id ? null : id;
    renderList();
    // Scroll card into view
    if (openId) {
      setTimeout(() => {
        const el = document.getElementById('card-' + openId);
        if (el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
      }, 50);
    }
    return;
  }
});

document.addEventListener('change', e => {
  if (e.target.matches('.cinp')) {
    const {id, t} = e.target.dataset;
    const target = parseInt(t);
    const nv = setC(id, e.target.value, target);
    e.target.value = nv;
    updateCard(id, target);
  }
});

// ── Ingredient search ──────────────────────────────────
let selectedIng = null;

function allIngredients() {
  const map = {};
  RECIPES.forEach(r => {
    parseIng(r.ing).forEach(i => {
      const key = i.name;
      if (!map[key]) map[key] = 0;
    });
  });
  return Object.keys(map).sort((a,b) => a.localeCompare(b, 'zh-Hant'));
}

function renderIngGrid() {
  const ings = allIngredients();
  document.getElementById('ingGrid').innerHTML = ings.map(name =>
    `<button class="ing-sel-chip${name===selectedIng?' active':''}" data-ing="${name}">${name}</button>`
  ).join('');
}

function renderIngResults(ingName) {
  const res = document.getElementById('srchResults');
  if (!ingName) { res.innerHTML = `<p class="srch-divider" style="text-align:center;margin-top:.5rem">👆 點上方食材查看需求</p>`; return; }

  // collect all recipes that use this ingredient
  const hits = [];
  RECIPES.forEach(r => {
    const ings = parseIng(r.ing);
    const found = ings.find(i => i.name === ingName);
    if (!found) return;
    const c = getC(r.id);
    const gap = Math.max(r.target - c, 0);
    const isDone = gap === 0;
    hits.push({r, qty: found.qty, gap, needed: isDone ? 0 : found.qty * gap, isDone});
  });

  if (!hits.length) { res.innerHTML = `<p class="srch-hint">沒有食譜使用「${ingName}」</p>`; return; }

  const totalNeeded = hits.reduce((s,h) => s + h.needed, 0);
  const needList = hits.filter(h => !h.isDone);
  const doneList = hits.filter(h => h.isDone);

  let html = '';
  html += `<div class="srch-total-row"><span>「${ingName}」共還需</span><span>${totalNeeded} 個</span></div>`;

  if (needList.length) {
    html += `<div class="srch-divider">尚未達標（${needList.length} 道）</div>`;
    needList.forEach(h => {
      html += `<div class="srch-item"><span class="sname">${h.r.name}</span><span class="sqty">×${h.qty} → 還需 ${h.needed}</span></div>`;
    });
  }
  if (doneList.length) {
    html += `<div class="srch-divider">已達標（${doneList.length} 道）</div>`;
    doneList.forEach(h => {
      html += `<div class="srch-item done-item"><span class="sname">✓ ${h.r.name}</span><span class="sqty">完成</span></div>`;
    });
  }
  res.innerHTML = html;
}

function openSearch() {
  renderIngGrid();
  renderIngResults(selectedIng);
  document.getElementById('srchPanel').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeSearch() {
  document.getElementById('srchPanel').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('srchBtn').addEventListener('click', openSearch);
document.getElementById('srchClose').addEventListener('click', closeSearch);
document.getElementById('srchPanel').addEventListener('click', e => {
  if (e.target === document.getElementById('srchPanel')) closeSearch();
});
document.getElementById('ingGrid').addEventListener('click', e => {
  const chip = e.target.closest('.ing-sel-chip');
  if (!chip) return;
  selectedIng = chip.dataset.ing;
  renderIngGrid();
  renderIngResults(selectedIng);
});

// ── Init ───────────────────────────────────────────────
renderAll();
</script>
