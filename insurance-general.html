<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>產險管理系統</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--tf:#0ABAB5;--tfl:#E0F7F6;--tfm:#5DCEC9;--tfd:#077B78;--tfdp:#045A58;--mint:#F0FAFA;--sage:#D4F0EE;--h:"Comic Sans MS","Chalkboard SE",cursive;}
body{background:#F5FAFA;font-family:var(--h);}
.app{padding:1rem 1rem;max-width:640px;margin:0 auto;}
.hdr{background:var(--tf);border-radius:22px;padding:1.2rem 1.5rem;margin-bottom:1rem;}
.hdr h1{font-size:26px;font-weight:600;color:#fff;font-family:var(--h);}
.hdr p{font-size:14px;color:rgba(255,255,255,0.85);font-family:var(--h);margin-top:2px;}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem;}
.tab{font-family:var(--h);font-size:16px;font-weight:600;padding:10px;border-radius:16px;border:1.5px solid var(--sage);background:#fff;color:var(--tfd);cursor:pointer;text-align:center;}
.tab.on{background:var(--tf);color:#fff;border-color:var(--tf);}
.pnl{display:none;}.pnl.on{display:block;}
.card{background:#fff;border-radius:22px;padding:1.2rem 1.3rem;margin-bottom:1rem;border:1.5px solid var(--sage);}
.ch{background:var(--mint);border-radius:16px;padding:8px 14px;margin-bottom:14px;border-left:4px solid var(--tf);font-family:var(--h);font-size:17px;font-weight:600;color:var(--tfd);}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px;}
.row1{display:grid;grid-template-columns:1fr;margin-bottom:10px;}
.f label{font-family:var(--h);font-size:14px;color:var(--tfd);display:block;margin-bottom:4px;font-weight:600;}
.f input,.f select{width:100%;font-family:var(--h);font-size:16px;border:1.5px solid var(--sage);border-radius:14px;padding:9px 13px;background:var(--mint);color:var(--tfdp);outline:none;}
.f input:focus,.f select:focus{border-color:var(--tf);background:#fff;}
.f input.err{border-color:#E24B4A;background:#FFF5F5;}
.em{font-family:var(--h);font-size:12px;color:#B03030;margin-top:3px;}
.xtra{background:var(--tfl);border-radius:16px;padding:12px 14px;margin-bottom:10px;border:1.5px dashed var(--tfm);}
.xtra-t{font-family:var(--h);font-size:14px;font-weight:600;color:var(--tfd);margin-bottom:10px;}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.ci{display:flex;align-items:center;gap:8px;font-family:var(--h);font-size:16px;color:var(--tfdp);}
.ci input[type=checkbox]{width:18px;height:18px;accent-color:var(--tf);}
.di{background:#fff;border-radius:12px;padding:8px 12px;margin-top:6px;display:none;align-items:center;gap:8px;flex-wrap:wrap;}
.di.show{display:flex;}
.di span{font-family:var(--h);font-size:13px;color:var(--tfd);}
.di input{font-family:var(--h);font-size:14px;border:1.5px solid var(--sage);border-radius:10px;padding:6px 9px;width:90px;outline:none;background:var(--mint);}
.tot{background:var(--tfl);border-radius:14px;padding:8px 14px;margin-top:8px;font-family:var(--h);font-size:16px;font-weight:600;color:var(--tfd);}
.abtn{width:100%;padding:12px;font-family:var(--h);font-size:18px;font-weight:600;cursor:pointer;margin-top:6px;border-radius:18px;background:var(--tf);color:#fff;border:none;}
.abtn:disabled{opacity:0.5;cursor:not-allowed;}
.si{width:100%;font-family:var(--h);font-size:16px;border:1.5px solid var(--sage);border-radius:14px;padding:9px 13px;background:var(--mint);color:var(--tfdp);outline:none;margin-bottom:12px;}
.st{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:1rem;}
.sc{background:var(--tfl);border-radius:20px;padding:12px 8px;text-align:center;border:1.5px solid var(--tfm);cursor:pointer;transition:all 0.15s;}
.sc:hover{background:var(--sage);}
.sc.active{background:var(--tf);border-color:var(--tfd);}
.sc.active .sn,.sc.active .sl{color:#fff;}
.sc-exp{background:#FFFBF0;border-color:#F5CC80;}
.sc-exp:hover{background:#FFF4E0;}
.sc-exp.active{background:#F5CC80;border-color:#E0A800;}
.sn{font-family:var(--h);font-size:26px;font-weight:600;color:var(--tfd);}
.sl{font-family:var(--h);font-size:13px;color:var(--tfd);margin-top:2px;}
.rc{background:#fff;border-radius:18px;padding:1rem 1.2rem;margin-bottom:10px;border:1.5px solid var(--sage);}
.rc.exp{border-color:#F5CC80;background:#FFFBF0;}
.rc.exd{border-color:#F0A8A8;background:#FFF5F5;}
.rn{font-family:var(--h);font-size:20px;font-weight:600;color:var(--tfdp);cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;}
.rn:hover{color:var(--tf);}
.rrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.bg{font-family:var(--h);font-size:13px;padding:3px 10px;border-radius:18px;font-weight:600;}
.bt{background:var(--tfl);color:var(--tfd);border:1.5px solid var(--tfm);}
.ba{background:#FFF4E0;color:#8A5C00;border:1.5px solid #F5CC80;}
.br{background:#FDECEA;color:#B03030;border:1.5px solid #F0A8A8;}
.bg2{background:#E6F4EA;color:#2E7D42;border:1.5px solid #A8D5B2;}
.bx{background:#F5F5F5;color:#666;border:1.5px solid #DDD;}
.rd{font-family:var(--h);font-size:14px;color:#777;margin-top:6px;line-height:1.8;}
.cb{font-family:var(--h);font-size:13px;color:var(--tfd);background:var(--tfl);border:1px solid var(--tfm);border-radius:10px;padding:3px 10px;cursor:pointer;margin-top:6px;margin-right:6px;}
.db{font-family:var(--h);font-size:13px;color:#ccc;background:none;border:none;cursor:pointer;padding:2px 6px;}
.emp{font-family:var(--h);font-size:17px;color:var(--tfm);text-align:center;padding:2rem 0;}
.sb{font-family:var(--h);font-size:14px;padding:8px 14px;border-radius:14px;margin-bottom:10px;text-align:center;}
.sl2{background:#FFF4E0;color:#8A5C00;border:1px solid #F5CC80;}
.sok{background:var(--tfl);color:var(--tfd);border:1px solid var(--tfm);}
.ser{background:#FDECEA;color:#B03030;border:1px solid #F0A8A8;}
.mb{font-family:var(--h);font-size:14px;padding:6px 14px;border-radius:12px;border:1.5px solid var(--sage);background:#fff;color:var(--tfd);cursor:pointer;margin:3px;}
.mb.on{background:var(--tf);color:#fff;border-color:var(--tf);}
.gb{font-family:var(--h);font-size:15px;font-weight:600;padding:8px 18px;border-radius:14px;background:var(--tf);color:#fff;border:none;cursor:pointer;margin-top:10px;}
.msg{background:var(--mint);border:1.5px solid var(--sage);border-radius:14px;padding:12px;margin-top:8px;font-family:var(--h);font-size:14px;color:var(--tfdp);white-space:pre-wrap;line-height:1.7;}
.co-label{font-family:var(--h);font-size:15px;font-weight:600;color:var(--tfd);margin-bottom:6px;}
.edit-btn{font-family:var(--h);font-size:13px;background:#FFF4E0;color:#8A5C00;border:1px solid #F5CC80;border-radius:10px;padding:3px 10px;cursor:pointer;margin-top:6px;margin-right:6px;}
.rec-edit-box{background:var(--mint);border:1.5px solid var(--sage);border-radius:16px;padding:14px;margin-top:10px;}
.rec-edit-t{font-family:var(--h);font-size:15px;font-weight:600;color:var(--tfd);margin-bottom:12px;}
.save-edit-btn{font-family:var(--h);font-size:14px;font-weight:600;padding:8px 18px;border-radius:12px;background:var(--tf);color:#fff;border:none;cursor:pointer;margin-right:8px;}
.cancel-edit-btn{font-family:var(--h);font-size:14px;padding:8px 18px;border-radius:12px;background:#fff;color:#888;border:1.5px solid var(--sage);cursor:pointer;}
.renew-edit{background:var(--mint);border-radius:14px;padding:10px 12px;margin-top:8px;border:1.5px solid var(--sage);}
.renew-edit-t{font-family:var(--h);font-size:13px;font-weight:600;color:var(--tfd);margin-bottom:8px;}
.renew-edit label{font-family:var(--h);font-size:13px;color:var(--tfd);font-weight:600;display:block;margin-bottom:4px;margin-top:8px;}
.renew-edit select{font-family:var(--h);font-size:15px;border:1.5px solid var(--sage);border-radius:12px;padding:7px 11px;background:#fff;color:var(--tfdp);outline:none;width:100%;margin-bottom:4px;}
.renew-edit input{font-family:var(--h);font-size:15px;border:1.5px solid var(--sage);border-radius:12px;padding:7px 11px;background:#fff;color:var(--tfdp);outline:none;width:100%;margin-bottom:4px;}
.save-btn{font-family:var(--h);font-size:14px;font-weight:600;padding:7px 16px;border-radius:12px;background:var(--tf);color:#fff;border:none;cursor:pointer;}
.car-other-box{background:#fff;border-radius:12px;padding:10px 12px;margin-top:8px;border:1.5px solid var(--sage);}
.car-other-name{font-family:var(--h);font-size:14px;border:1.5px solid var(--sage);border-radius:10px;padding:6px 9px;width:100%;outline:none;background:var(--mint);margin-bottom:8px;}
.re-f{margin-bottom:10px;}
.re-f label{font-family:var(--h);font-size:14px;color:var(--tfd);display:block;margin-bottom:4px;font-weight:600;}
.re-f input,.re-f select{width:100%;font-family:var(--h);font-size:15px;border:1.5px solid var(--sage);border-radius:12px;padding:8px 11px;background:#fff;color:var(--tfdp);outline:none;}
.re-xtra{background:var(--tfl);border-radius:14px;padding:10px 12px;margin-bottom:10px;border:1.5px dashed var(--tfm);}
.re-xtra-t{font-family:var(--h);font-size:13px;font-weight:600;color:var(--tfd);margin-bottom:8px;}
.re-cg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px;}
.re-ci{display:flex;align-items:center;gap:6px;font-family:var(--h);font-size:15px;color:var(--tfdp);}
.re-ci input[type=checkbox]{width:16px;height:16px;accent-color:var(--tf);}
.re-di{background:#fff;border-radius:10px;padding:6px 10px;margin-top:4px;display:none;align-items:center;gap:6px;flex-wrap:wrap;}
.re-di.show{display:flex;}
.re-di span{font-family:var(--h);font-size:12px;color:var(--tfd);}
.re-di input{font-family:var(--h);font-size:13px;border:1.5px solid var(--sage);border-radius:8px;padding:5px 7px;width:80px;outline:none;background:var(--mint);}
.re-tot{background:#fff;border-radius:10px;padding:6px 12px;margin-top:6px;font-family:var(--h);font-size:14px;font-weight:600;color:var(--tfd);}
.exp-banner{background:#FFF4E0;border:1.5px solid #F5CC80;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-family:var(--h);font-size:14px;color:#8A5C00;display:flex;align-items:center;justify-content:space-between;}
.exp-banner-close{background:none;border:none;font-size:16px;color:#8A5C00;cursor:pointer;}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.45);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;}
.modal-box{background:#fff;border-radius:22px;padding:1.4rem;width:100%;max-width:600px;position:relative;margin:auto;}
.modal-close{position:absolute;top:14px;right:14px;background:var(--sage);border:none;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;color:var(--tfd);display:flex;align-items:center;justify-content:center;}
.modal-title{font-family:var(--h);font-size:20px;font-weight:600;color:var(--tfdp);margin-bottom:14px;padding-right:40px;}
.modal-info{background:var(--mint);border-radius:16px;padding:12px 14px;margin-bottom:14px;border:1.5px solid var(--sage);}
.modal-info-row{font-family:var(--h);font-size:14px;color:var(--tfdp);line-height:2;}
.modal-info-label{color:var(--tfd);font-weight:600;margin-right:6px;}
.modal-section-t{font-family:var(--h);font-size:15px;font-weight:600;color:var(--tfd);margin-bottom:8px;border-left:4px solid var(--tf);padding-left:8px;}
.premium-compare{background:#FFF4E0;border-radius:10px;padding:6px 12px;margin-top:6px;font-family:var(--h);font-size:13px;color:#8A5C00;border:1px solid #F5CC80;}
.dup-modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;}
.dup-modal-box{background:#fff;border-radius:22px;padding:1.6rem;width:100%;max-width:400px;}
.dup-modal-title{font-family:var(--h);font-size:18px;font-weight:600;color:#B03030;margin-bottom:10px;}
.dup-modal-msg{font-family:var(--h);font-size:15px;color:var(--tfdp);line-height:1.8;margin-bottom:18px;white-space:pre-line;}
.dup-modal-btns{display:flex;gap:10px;}
.dup-continue-btn{font-family:var(--h);font-size:14px;font-weight:600;padding:8px 18px;border-radius:12px;background:#E24B4A;color:#fff;border:none;cursor:pointer;flex:1;}
.dup-cancel-btn{font-family:var(--h);font-size:14px;padding:8px 18px;border-radius:12px;background:#fff;color:#888;border:1.5px solid var(--sage);cursor:pointer;flex:1;}
.client-card{background:var(--mint);border-radius:18px;padding:1rem 1.2rem;margin-bottom:12px;border:1.5px solid var(--tfm);}
.client-card-title{font-family:var(--h);font-size:16px;font-weight:600;color:var(--tfd);margin-bottom:8px;border-left:4px solid var(--tf);padding-left:8px;}
.client-card-row{font-family:var(--h);font-size:14px;color:var(--tfdp);line-height:2;}
.client-card-label{color:var(--tfd);font-weight:600;margin-right:6px;}
.policy-section-t{font-family:var(--h);font-size:14px;font-weight:600;color:var(--tfd);margin-bottom:8px;margin-top:4px;}

/* ── 到期提醒：緊湊列表樣式 ── */
.e-section-hdr{display:flex;align-items:center;gap:8px;margin:14px 0 6px;}
.e-section-hdr span{font-family:var(--h);font-size:13px;font-weight:600;color:var(--tfd);}
.e-section-hdr::after{content:'';flex:1;height:1.5px;background:var(--sage);}
.e-row{border:1.5px solid var(--sage);border-radius:14px;margin-bottom:7px;overflow:hidden;background:#fff;}
.e-row.warn{border-color:#F5CC80;background:#FFFBF0;}
.e-row.danger{border-color:#F0A8A8;background:#FFF5F5;}
.e-row.done{border-color:#A8D5B2;background:#F0FDF4;}
.e-row.gray{border-color:#DDD;background:#F9F9F9;}
.e-main{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;}
.e-name{font-family:var(--h);font-size:15px;font-weight:600;color:var(--tfdp);min-width:58px;}
.e-plate{font-family:var(--h);font-size:11px;color:var(--tfd);background:var(--tfl);border-radius:4px;padding:2px 7px;border:1px solid var(--sage);white-space:nowrap;}
.e-type{font-family:var(--h);font-size:12px;color:#888;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.e-days{font-family:var(--h);font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap;}
.e-days-warn{background:#FFF4E0;color:#8A5C00;}
.e-days-ok{background:#E6F4EA;color:#2E7D42;}
.e-days-exp{background:#FDECEA;color:#B03030;}
.e-days-done{background:#E6F4EA;color:#2E7D42;}
.e-days-no{background:#F5F5F5;color:#666;}
.e-prem{font-family:var(--h);font-size:13px;color:#888;text-align:right;min-width:52px;white-space:nowrap;}
.e-expand{padding:10px 12px 12px;border-top:1.5px solid var(--sage);background:var(--mint);}
.e-reason{font-family:var(--h);font-size:13px;color:#888;margin-bottom:8px;}
.e-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.e-label{font-family:var(--h);font-size:12px;font-weight:600;color:var(--tfd);}
.e-sel{font-family:var(--h);font-size:14px;border:1.5px solid var(--sage);border-radius:10px;padding:6px 9px;background:#fff;color:var(--tfdp);outline:none;}
.e-date-in{font-family:var(--h);font-size:14px;border:1.5px solid var(--sage);border-radius:10px;padding:6px 9px;background:#fff;color:var(--tfdp);outline:none;}
.e-rr-in{font-family:var(--h);font-size:13px;border:1.5px solid var(--sage);border-radius:10px;padding:6px 9px;background:#fff;color:var(--tfdp);outline:none;width:130px;}
.e-save-btn{font-family:var(--h);font-size:13px;font-weight:600;padding:6px 16px;border-radius:10px;background:var(--tf);color:#fff;border:none;cursor:pointer;}
.e-edit-btn{font-family:var(--h);font-size:13px;padding:6px 14px;border-radius:10px;background:#fff;color:var(--tfd);border:1.5px solid var(--sage);cursor:pointer;}
#wa-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:#dfe6e6;overflow:auto;-webkit-overflow-scrolling:touch;}
.wa-bar{position:sticky;top:0;z-index:2;background:#00897b;color:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;}
.wa-bar button{border:none;border-radius:14px;padding:8px 14px;font-size:14px;background:#fff;color:#00695c;font-weight:600;}
.wa-paper{width:760px;margin:10px auto;background:#fff;padding:14px 16px;font-size:12px;color:#111;font-family:"PingFang TC","Heiti TC",sans-serif;box-sizing:border-box;}
.wa-paper table{width:100%;border-collapse:collapse;}
.wa-paper td,.wa-paper th{border:1px solid #333;padding:4px 6px;vertical-align:middle;}
.wa-paper th.wa-h{background:#444;color:#fff;font-weight:600;text-align:center;padding:3px;}
.wa-paper td.wa-l{width:150px;font-weight:600;}
.wa-paper .wa-i{border:none;border-bottom:1px solid #888;background:transparent;font:inherit;color:#1a3fa0;padding:1px 2px;border-radius:0;outline:none;box-sizing:border-box;}
.wa-paper .wa-c{display:inline-flex;align-items:center;gap:2px;margin-right:8px;white-space:nowrap;}
.wa-paper .wa-c input{margin:0;width:13px;height:13px;}
.wa-paper .wa-n{font-size:8.5px;line-height:1.45;color:#222;}
@media print{body{overflow:visible!important;}body>*:not(#wa-overlay){display:none!important;}#wa-overlay{position:static!important;overflow:visible!important;background:#fff!important;}.wa-bar{display:none!important;}.wa-paper{margin:0!important;box-shadow:none;width:100%!important;zoom:1!important;}@page{size:A4;margin:8mm;}}
</style>
</head>
<body>
<div class="app">
<div class="hdr"><h1>產險管理系統</h1><p>輸入・查詢・到期提醒</p></div>
<div id="sb" class="sb sl2">連線中，載入資料...</div>
<div class="tabs">
  <div class="tab on" onclick="sw('input')">輸入保單</div>
  <div class="tab" onclick="sw('search')">查詢</div>
  <div class="tab" onclick="sw('expiry')">到期提醒</div>
</div>
<div id="pnl-input" class="pnl on">
<div class="card">
<div class="ch">客戶基本資料</div>
<div class="row">
  <div class="f"><label>身份</label><select id="fi" onchange="togId()"><option>個人</option><option>公司</option></select></div>
  <div class="f"><label>姓名／負責人</label>
    <input id="fn" type="text" placeholder="王小明" oninput="searchClient(this.value)">
    <div id="client-suggest" style="display:none;background:#fff;border:1.5px solid var(--sage);border-radius:14px;margin-top:4px;overflow:hidden;"></div>
  </div>
</div>
<div id="pf">
  <div class="row">
    <div class="f"><label>身分證字號</label><input id="fid" type="text" placeholder="A123456789" maxlength="10" oninput="vId()"><div class="em" id="eid"></div></div>
    <div class="f"><label>生日</label>
      <div style="display:flex;gap:5px;">
        <select id="fb-y" style="flex:2;font-family:var(--h);font-size:15px;border:1.5px solid var(--sage);border-radius:14px;padding:8px 6px;background:var(--mint);color:var(--tfdp);outline:none;"><option value="">年</option></select>
        <select id="fb-m" style="flex:1;font-family:var(--h);font-size:15px;border:1.5px solid var(--sage);border-radius:14px;padding:8px 6px;background:var(--mint);color:var(--tfdp);outline:none;"><option value="">月</option></select>
        <select id="fb-d" style="flex:1;font-family:var(--h);font-size:15px;border:1.5px solid var(--sage);border-radius:14px;padding:8px 6px;background:var(--mint);color:var(--tfdp);outline:none;"><option value="">日</option></select>
      </div>
    </div>
  </div>
</div>
<div id="cf" style="display:none">
  <div class="row">

    <input type="text" id="car-other-name" class="car-other-name" placeholder="請填寫險種名稱">

      <span style="font-family:var(--h);font-size:13px;color:var(--tfd);">保費</span>
      <input type="number" id="car-other-p" style="font-family:var(--h);font-size:14px;border:1.5px solid var(--sage);border-radius:10px;padding:6px 9px;width:90px;outline:none;background:var(--mint);" placeholder="0" oninput="calcT()">
      <span style="font-family:var(--h);font-size:13px;color:var(--tfd);">元　保額</span>
      <input type="number" id="car-other-a" style="font-family:var(--h);font-size:14px;border:1.5px solid var(--sage);border-radius:10px;padding:6px 9px;width:90px;outline:none;background:var(--mint);" placeholder="0">
      <span style="font-family:var(--h);font-size:13px;color:var(--tfd);">萬</span>

<div id="xmand" style="display:none" class="xtra">

  <div class="xtra-t">住宅火險資料</div>
  <div class="row">
    <div class="f"><label>保費（元）</label><input id="ffire-pr" type="number" placeholder="0"></div>

    <div class="f"><label>保費（元）</label><input id="fpr" type="number" placeholder="0"></div>

    <div></div>
  </div>
</div>
<div id="xotn" style="display:none" class="row1">
  <div class="f"><label>其他險種說明</label><input id="fotn" type="text" placeholder="請填寫險種名稱"></div>
</div>
<div class="row">
  <div class="f"><label>到期日</label>
    <div style="display:flex;gap:5px;">
      <select id="fex-y" style="flex:2;font-family:var(--h);font-size:15px;border:1.5px solid var(--sage);border-radius:14px;padding:8px 6px;background:var(--mint);color:var(--tfdp);outline:none;"><option value="">年</option></select>
      <select id="fex-m" style="flex:1;font-family:var(--h);font-size:15px;border:1.5px solid var(--sage);border-radius:14px;padding:8px 6px;background:var(--mint);color:var(--tfdp);outline:none;"><option value="">月</option></select>
      <select id="fex-d" style="flex:1;font-family:var(--h);font-size:15px;border:1.5px solid var(--sage);border-radius:14px;padding:8px 6px;background:var(--mint);color:var(--tfdp);outline:none;"><option value="">日</option></select>
    </div>
  </div>
  <div class="f"><label>負責人</label><select id="fow"><option>巧</option><option>吳忠皇</option><option>小剛</option></select></div>
</div>
<div class="row">
  <div class="f"><label>續保狀態</label><select id="frn" onchange="togRn()"><option>待確認</option><option>已續保</option><option>不續保</option></select></div>
  <div class="f" id="frnr" style="display:none"><label>不續保原因</label><input id="frnrv" type="text" placeholder="請填寫原因"></div>
</div>
<div class="row1"><div class="f"><label>備註</label><input id="fnt" type="text" placeholder="補充說明..."></div></div>
<button class="abtn" id="abtn" onclick="addR()">＋ 新增保單</button>

</div>

  <div class="sc" id="sc-tot" onclick="filterSt('all')"><div class="sn" id="stot">—</div><div class="sl">總保單數</div></div>
  <div class="sc sc-exp" id="sc-exp" onclick="filterSt('exp')"><div class="sn" id="sexp">—</div><div class="sl">即將到期</div></div>
  <div class="sc" id="sc-cli" onclick="filterSt('cli')"><div class="sn" id="scli">—</div><div class="sl">客戶數</div></div>

  <span>⚠️ 顯示 45 天內即將到期保單</span>
  <button class="exp-banner-close" onclick="clearFilter()">✕ 清除篩選</button>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;">
  <div class="f"><label>險種</label><select id="flt-type" onchange="rendS()" style="font-family:var(--h);font-size:15px;border:1.5px solid var(--sage);border-radius:14px;padding:8px 11px;background:var(--mint);color:var(--tfdp);outline:none;width:100%;"><option value="">全部險種</option></select></div>
  <div class="f"><label>保險公司</label><select id="flt-company" onchange="rendS()" style="font-family:var(--h);font-size:15px;border:1.5px solid var(--sage);border-radius:14px;padding:8px 11px;background:var(--mint);color:var(--tfdp);outline:none;width:100%;"><option value="">全部公司</option></select></div>
  <div class="f"><label>續保狀態</label><select id="flt-renew" onchange="rendS()" style="font-family:var(--h);font-size:15px;border:1.5px solid var(--sage);border-radius:14px;padding:8px 11px;background:var(--mint);color:var(--tfdp);outline:none;width:100%;"><option value="">全部狀態</option><option>待確認</option><option>已續保</option><option>不續保</option></select></div>
</div>
<input class="si" id="sq" type="text" placeholder="輸入姓名、公司名稱或車牌搜尋..." oninput="rendS()">
<div id="client-card-area"></div>
<div id="slist"><div class="emp">輸入關鍵字開始搜尋</div></div>
</div>
<div id="pnl-expiry" class="pnl">
<div class="card">
  <div class="ch">選擇到期月份</div>
  <div id="mbs"></div>
  <button class="gb" onclick="genMsg()">產出各公司續保名單訊息</button>
  <div id="rmsg"></div>
</div>
<div id="elist"></div>
</div>
<div id="client-modal" class="modal-overlay" style="display:none;" onclick="closeModalOuter(event)">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-content"></div>
  </div>
</div>
<div id="dup-modal" class="dup-modal-overlay" style="display:none;">
  <div class="dup-modal-box">
    <div class="dup-modal-title">⚠️ 發現重複保單</div>
    <div class="dup-modal-msg" id="dup-modal-msg"></div>
    <div class="dup-modal-btns">
      <button class="dup-cancel-btn" onclick="closeDupModal()">取消，重新確認</button>
      <button class="dup-continue-btn" onclick="confirmAddR()">確認，仍要新增</button>
    </div>
  </div>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbyesIjaz0CIIMplfk_hyEBp__W5eWq4LQvMNPQGuX7L14_0zp1Sx6fB9W9CD1QaD1XCGA/exec';
const DET=['強制險','體傷','財損','超額','拖吊','駕傷','全險'];
const COMPANIES=['華南','國泰','新光','富邦','明台','台產','和泰','第一','旺旺','泰安','中信產','新安東京'];
let recs=[],selM=new Date().getMonth()+1,curFilter='none';
let pendingRec=null;
function initDateSelects(){
  var now=new Date(),curY=now.getFullYear();
  var ysel=document.getElementById('fb-y');
  for(var y=curY;y>=1940;y--){var o=document.createElement('option');o.value=y;o.textContent=y+'年';ysel.appendChild(o);}
  var eysel=document.getElementById('fex-y');
  for(var y=curY;y<=curY+10;y++){var o=document.createElement('option');o.value=y;o.textContent=y+'年';eysel.appendChild(o);}
  eysel.value=curY;
  ['fb-m','fex-m'].forEach(function(id){
    var s=document.getElementById(id);
    for(var m=1;m<=12;m++){var o=document.createElement('option');o.value=String(m).padStart(2,'0');o.textContent=m+'月';s.appendChild(o);}
  });
  ['fb-d','fex-d'].forEach(function(id){
    var s=document.getElementById(id);
    for(var d=1;d<=31;d++){var o=document.createElement('option');o.value=String(d).padStart(2,'0');o.textContent=d+'日';s.appendChild(o);}
  });
}
function getBirthday(){
  var y=document.getElementById('fb-y').value,m=document.getElementById('fb-m').value,d=document.getElementById('fb-d').value;
  return (y&&m&&d)?y+'-'+m+'-'+d:'';
}
function getExpiry(){
  var y=document.getElementById('fex-y').value,m=document.getElementById('fex-m').value,d=document.getElementById('fex-d').value;
  return (y&&m&&d)?y+'-'+m+'-'+d:'';
}
function resetDateSelects(){
  ['fb-y','fb-m','fb-d','fex-y','fex-m','fex-d'].forEach(function(id){
    var e=document.getElementById(id);if(e)e.selectedIndex=0;
  });
}
function normDate(d){
  if(!d)return '';
  try{
    var s=String(d).trim();
    if(s.length>=10&&s.substring(4,5)==='-')return s.substring(0,10);
    var dt=new Date(s);
    if(!isNaN(dt))return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
    return '';
  }catch(e){return '';}
}
function buildRenewDateSelects(rid,curExpiry){
  var ep=normDate(curExpiry).split('-');
  var ey=ep[0]||'',em=ep[1]||'',ed=ep[2]||'';
  var cy=new Date().getFullYear();
  var yOpts='<option value="">年</option>';
  for(var y=cy-2;y<=cy+10;y++)yOpts+='<option value="'+y+'"'+(ey==y?' selected':'')+'>'+y+'年</option>';
  var mOpts='<option value="">月</option>';
  for(var m=1;m<=12;m++){var mv=String(m).padStart(2,'0');mOpts+='<option value="'+mv+'"'+(em===mv?' selected':'')+'>'+m+'月</option>';}
  var dOpts='<option value="">日</option>';
  for(var d=1;d<=31;d++){var dv=String(d).padStart(2,'0');dOpts+='<option value="'+dv+'"'+(ed===dv?' selected':'')+'>'+d+'日</option>';}
  return '<label>到期日</label>'
    +'<div style="display:flex;gap:5px;margin-bottom:8px;">'
    +'<select id="rn-ey-'+rid+'" style="flex:2;font-family:var(--h);font-size:14px;border:1.5px solid var(--sage);border-radius:12px;padding:6px;background:#fff;color:var(--tfdp);outline:none;">'+yOpts+'</select>'
    +'<select id="rn-em-'+rid+'" style="flex:1;font-family:var(--h);font-size:14px;border:1.5px solid var(--sage);border-radius:12px;padding:6px;background:#fff;color:var(--tfdp);outline:none;">'+mOpts+'</select>'
    +'<select id="rn-ed-'+rid+'" style="flex:1;font-family:var(--h);font-size:14px;border:1.5px solid var(--sage);border-radius:12px;padding:6px;background:#fff;color:var(--tfdp);outline:none;">'+dOpts+'</select>'
    +'</div>';
}
function searchClient(q){
  var box=document.getElementById('client-suggest');
  if(!q||q.length<1){box.style.display='none';return;}
  var matches=[],seen={};
  recs.forEach(function(r){
    if(r.name&&r.name.toLowerCase().includes(q.toLowerCase())&&!seen[r.name]){seen[r.name]=true;matches.push(r);}
  });
  if(!matches.length){box.style.display='none';return;}
  box.innerHTML=matches.slice(0,5).map(function(r){
    return '<div style="padding:10px 14px;cursor:pointer;font-family:var(--h);font-size:15px;color:var(--tfdp);border-bottom:1px solid var(--sage);" '
      +'onclick="fillClient(\''+encodeURIComponent(JSON.stringify(r))+'\')">'
      +r.name+(r.phone?' · '+r.phone:'')+(r.plate?' · '+r.plate:'')+'</div>';
  }).join('');
  box.style.display='block';
}
function fillClient(enc){
  var r=JSON.parse(decodeURIComponent(enc));
  document.getElementById('fn').value=r.name||'';
  document.getElementById('fid').value=r.idno||'';
  var ph=String(r.phone||'');
  if(ph&&ph.length===9&&!ph.startsWith('0')) ph='0'+ph;
  document.getElementById('fph').value=ph;
  document.getElementById('fad').value=r.address||'';
  document.getElementById('fi').value=r.identity||'個人';
  togId();
  if(r.identity==='公司'){
    document.getElementById('fcn').value=r.companyname||'';
    document.getElementById('ftx').value=r.taxid||'';
  }
  if(r.birthday){
    var bStr=String(r.birthday).trim().substring(0,10),parts=bStr.split('-');
    if(parts.length===3){
      setTimeout(function(){
        document.getElementById('fb-y').value=parts[0];
        document.getElementById('fb-m').value=parts[1].padStart(2,'0');
        document.getElementById('fb-d').value=parts[2].padStart(2,'0');
      },100);
    }
  }
  document.getElementById('client-suggest').style.display='none';
  document.getElementById('fpl').value='';
  document.getElementById('ftp').value='';
  document.getElementById('fco').value='';
  document.getElementById('fex-y').selectedIndex=0;
  document.getElementById('fex-m').selectedIndex=0;
  document.getElementById('fex-d').selectedIndex=0;
  document.getElementById('fnt').value='';
  document.getElementById('xcar').style.display='none';
  document.getElementById('xfire').style.display='none';
  document.getElementById('xoth').style.display='none';
  document.getElementById('xotn').style.display='none';
  initCar();
}
function fmtPhone(p){
  if(!p)return '';
  var s=String(p).trim();
  if(s.length===9&&!s.startsWith('0'))return '0'+s;
  return s;
}
function fmtDate(d){
  if(!d)return '－';
  try{
    var s=String(d).trim();
    if(s.length>=10&&s.substring(4,5)==='-')return s.substring(0,10);
    var dt=new Date(s);
    if(!isNaN(dt))return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
    return s.substring(0,10);
  }catch(e){return String(d).substring(0,10);}
}
function setSb(t,m){var b=document.getElementById('sb');b.className='sb '+t;b.textContent=m;}
function sw(t){
  document.querySelectorAll('.tab').forEach(function(e,i){e.classList.toggle('on',['input','search','expiry'][i]===t);});
  document.querySelectorAll('.pnl').forEach(function(e){e.classList.remove('on');});
  document.getElementById('pnl-'+t).classList.add('on');
  if(t==='search'){curFilter='none';rendS();}
  if(t==='expiry'){initM();rendE();}
}
function togId(){var v=document.getElementById('fi').value;document.getElementById('pf').style.display=v==='個人'?'block':'none';document.getElementById('cf').style.display=v==='公司'?'block':'none';}
function togRn(){document.getElementById('frnr').style.display=document.getElementById('frn').value==='不續保'?'block':'none';}
function vId(){var v=document.getElementById('fid').value,ok=/^[A-Za-z][0-9]{9}$/.test(v);document.getElementById('fid').className=v.length===10&&!ok?'err':'';document.getElementById('eid').textContent=v.length===10&&!ok?'格式錯誤：1英文+9數字':'';}
function vPh(){var v=document.getElementById('fph').value,ok=/^[0-9]{10}$/.test(v);document.getElementById('fph').className=v.length===10&&!ok?'err':'';document.getElementById('eph').textContent=v.length===10&&!ok?'應為10位數字':'';}
function vTx(){var v=document.getElementById('ftx').value,ok=/^[0-9]{8}$/.test(v);document.getElementById('ftx').className=v.length===8&&!ok?'err':'';document.getElementById('etx').textContent=v.length===8&&!ok?'應為8位數字':'';}
function updType(){
  var t=document.getElementById('ftp').value;
  document.getElementById('xcar').style.display=t==='車險'?'block':'none';
  document.getElementById('xmand').style.display='none';
  document.getElementById('xfire').style.display=t==='住宅火險'?'block':'none';
  document.getElementById('xoth').style.display=(t&&t!=='車險'&&t!=='強制險'&&t!=='住宅火險')?'block':'none';
  document.getElementById('xotn').style.display=t==='其他'?'block':'none';
}
function initCar(){
  var g=document.getElementById('cg');
  g.innerHTML=DET.map(function(d){
    return '<div><div class="ci"><input type="checkbox" id="c'+d+'" onchange="togD(\''+d+'\')"><label for="c'+d+'">'+d+'</label></div>'
      +'<div class="di" id="d'+d+'"><span>保費</span><input type="number" id="p'+d+'" placeholder="0" oninput="calcT()">元<span>保額</span><input type="number" id="a'+d+'" placeholder="0">萬</div></div>';
  }).join('');
  g.innerHTML+='<div><div class="ci"><input type="checkbox" id="c其他車險" onchange="togCarOther()"><label for="c其他車險">其他</label></div></div>';
  document.getElementById('car-other-area').style.display='none';
  document.getElementById('car-other-name').value='';
  var cop=document.getElementById('car-other-p');if(cop)cop.value='';
  var coa=document.getElementById('car-other-a');if(coa)coa.value='';
}
function togCarOther(){
  var c=document.getElementById('c其他車險');
  document.getElementById('car-other-area').style.display=c.checked?'block':'none';
  calcT();
}
function togD(d){var c=document.getElementById('c'+d),di=document.getElementById('d'+d);di.className='di'+(c.checked?' show':'');calcT();}
function calcT(){
  var t=0;
  DET.forEach(function(d){var c=document.getElementById('c'+d);if(c&&c.checked){var p=document.getElementById('p'+d);if(p)t+=parseInt(p.value)||0;}});
  var co=document.getElementById('c其他車險');
  if(co&&co.checked){var cop=document.getElementById('car-other-p');if(cop)t+=parseInt(cop.value)||0;}
  var el=document.getElementById('ctot');if(el)el.textContent=t.toLocaleString();
}
function rendClientCard(name){
  var area=document.getElementById('client-card-area');
  if(!name){area.innerHTML='';return;}
  var clientRecs=recs.filter(function(r){return r.name===name;});
  if(!clientRecs.length){area.innerHTML='';return;}
  function getBest(field){
    var found=clientRecs.find(function(r){return r[field]&&String(r[field]).trim()!=='';});
    return found?found[field]:'';
  }
  var identity=getBest('identity')||'個人';
  var isCompany=identity==='公司';
  var html='<div class="client-card">';
  html+='<div class="client-card-title">'+(isCompany?'🏢 ':'👤 ')+(isCompany?(getBest('companyname')||name):name)+'</div>';
  if(isCompany){
    html+='<div class="client-card-row"><span class="client-card-label">公司名稱</span>'+(getBest('companyname')||'－')+'</div>';
    html+='<div class="client-card-row"><span class="client-card-label">統一編號</span>'+(getBest('taxid')||'－')+'</div>';
    html+='<div class="client-card-row"><span class="client-card-label">負責人</span>'+name+'</div>';
    if(getBest('idno'))html+='<div class="client-card-row"><span class="client-card-label">身分證</span>'+getBest('idno')+'</div>';
    if(getBest('birthday'))html+='<div class="client-card-row"><span class="client-card-label">生日</span>'+fmtDate(getBest('birthday'))+'</div>';
  }else{
    html+='<div class="client-card-row"><span class="client-card-label">身分證</span>'+(getBest('idno')||'－')+'</div>';
    var bday=getBest('birthday');

async function saveRecEdit(name,oldExpiry,type){
  var company=document.getElementById('re-company').value;
  var ey=document.getElementById('re-ey').value,em=document.getElementById('re-em').value,ed=document.getElementById('re-ed').value;
  var newExpiry=(ey&&em&&ed)?ey+'-'+em+'-'+ed:oldExpiry;
  var renew=document.getElementById('re-renew').value;
  var note=document.getElementById('re-note').value.trim();
  var dets=[],tot=0,premium=0,amount='',loanbank='';
  if(type==='車險'){
    DET.forEach(function(d){var c=document.getElementById('re-c'+d);if(c&&c.checked){var p=parseInt(document.getElementById('re-p'+d).value)||0,a=document.getElementById('re-a'+d).value||'';dets.push({name:d,premium:p,amount:a});tot+=p;}});
    var co=document.getElementById('re-c其他');
    if(co&&co.checked){var coName=document.getElementById('re-other-name').value.trim()||'其他',coP=parseInt(document.getElementById('re-other-p').value)||0,coA=document.getElementById('re-other-a').value||'';dets.push({name:coName,premium:coP,amount:coA});tot+=coP;}
    premium=tot;
  }else if(type==='住宅火險'){
    premium=parseInt(document.getElementById('re-fire-pr').value)||0;
    amount=document.getElementById('re-fire-am').value||'';
    loanbank=document.getElementById('re-fire-bank').value.trim();
    tot=premium;
  }else{
    premium=parseInt(document.getElementById('re-oth-pr').value)||0;
    amount=document.getElementById('re-oth-am').value||'';
    tot=premium;
  }
  setSb('sl2','更新中...');
  try{
    var owner=document.getElementById('re-owner').value;
    var url=API+'?action=update_record&name='+encodeURIComponent(name)+'&oldExpiry='+encodeURIComponent(oldExpiry)+'&company='+encodeURIComponent(company)+'&expiry='+encodeURIComponent(newExpiry)+'&renew='+encodeURIComponent(renew)+'&note='+encodeURIComponent(note)+'&premium='+encodeURIComponent(premium)+'&amount='+encodeURIComponent(amount)+'&totalpremium='+encodeURIComponent(tot)+'&cardetails='+encodeURIComponent(JSON.stringify(dets))+'&loanbank='+encodeURIComponent(loanbank)+'&owner='+encodeURIComponent(owner);
    await fetch(url);
    recs.forEach(function(r){if(r.name===name&&r.expiry===oldExpiry){r.lastpremium=r.totalpremium;r.company=company;r.expiry=newExpiry;r.renew=renew;r.note=note;r.premium=premium;r.amount=amount;r.totalpremium=tot;r.cardetails=JSON.stringify(dets);r.loanbank=loanbank;r.owner=owner;}});
    var box=document.getElementById('rec-edit-global');if(box)box.remove();
    setSb('sok','已更新');rendS();rendE();updSt();
  }catch(e){setSb('ser','更新失敗');}
}

function rendS(){

  var fltRenew=document.getElementById('flt-renew').value;
  var fltCompany=document.getElementById('flt-company').value;
  var td=new Date(),d45=new Date();d45.setDate(d45.getDate()+45);
  var f;
  var cardArea=document.getElementById('client-card-area');
  if(curFilter==='exp'){
    cardArea.innerHTML='';

    if(fltType)f=f.filter(function(r){return r.type===fltType;});
    if(fltRenew)f=f.filter(function(r){return r.renew===fltRenew;});
    if(fltCompany)f=f.filter(function(r){return r.company===fltCompany;});
    f.sort(function(a,b){return dl(a.expiry)-dl(b.expiry);});
    document.getElementById('slist').innerHTML=f.length?f.map(function(r){return rHTML(r,true);}).join(''):'<div class="emp">目前沒有符合條件的保單</div>';
    return;
  }
  var hasFilter=fltType||fltRenew||fltCompany;
  if(!q&&!hasFilter){
    cardArea.innerHTML='';
    document.getElementById('slist').innerHTML='<div class="emp">輸入關鍵字或選擇篩選條件</div>';
    return;
  }
  f=recs.filter(function(r){
    var matchQ=!q||(String(r.name||'').toLowerCase().includes(q)||String(r.plate||'').toLowerCase().includes(q)||String(r.companyname||'').toLowerCase().includes(q));
    var matchType=!fltType||r.type===fltType;
    var matchRenew=!fltRenew||r.renew===fltRenew;
    var matchCompany=!fltCompany||r.company===fltCompany;
    return matchQ&&matchType&&matchRenew&&matchCompany;
  });
  if(!f.length){
    cardArea.innerHTML='';
    document.getElementById('slist').innerHTML='<div class="emp">找不到符合條件的保單</div>';
    return;
  }
  var names=new Set(f.map(function(r){return r.name;}));
  if(names.size===1&&!hasFilter){
    rendClientCard(f[0].name);

}

  waScale();ov.scrollTop=0;
}
function goClient(enc){
  var name=decodeURIComponent(enc);
  sw('search');
  ['flt-type','flt-company','flt-renew'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
  document.getElementById('sq').value=name;
  rendS();
  window.scrollTo(0,0);
}
/* ── 到期提醒：緊湊列表 ── */
function eHTML(r){
  var d=dl(r.expiry);
  var rid='er'+r.name.replace(/\s/g,'')+r.expiry.replace(/-/g,'');
  var daysCls,daysTxt,rowCls;
  if(r.renew==='已續保'){daysTxt='已續保';daysCls='e-days-done';rowCls='done';}
  else if(r.renew==='不續保'){daysTxt='不續保';daysCls='e-days-no';rowCls='gray';}
  else if(d<0){daysTxt='已到期';daysCls='e-days-exp';rowCls='danger';}
  else if(d<=15){daysTxt='剩'+d+'天';daysCls='e-days-warn';rowCls='warn';}
  else{daysTxt='剩'+d+'天';daysCls='e-days-ok';rowCls='';}
  var premium=r.totalpremium?'$'+Number(r.totalpremium).toLocaleString():'—';
  var plate=r.plate?'<span class="e-plate">'+r.plate+'</span>':'';
  var typeStr=(r.type||'')+(r.company?'・'+r.company:'');
  var displayName=r.identity==='公司'&&r.companyname?r.companyname:r.name;
  var curDateStr=normDate(r.expiry);
  var expandContent;
  if(r.renew==='不續保'){
    expandContent=(r.renewreason?'<div class="e-reason">原因：'+r.renewreason+'</div>':'')
      +'<button class="e-edit-btn" onclick="openRecEdit(this,\''+encodeURIComponent(JSON.stringify(r))+'\')">編輯保單</button>';
  }else{
    expandContent='<div class="e-actions">'
      +'<span class="e-label">續保狀態</span>'
      +'<select class="e-sel" id="rs-'+rid+'"><option>待確認</option><option>已續保</option><option>不續保</option></select>'
      +'<span class="e-label">到期日</span>'
      +'<input type="date" class="e-date-in" id="rd-'+rid+'" value="'+curDateStr+'">'
      +'<input type="text" class="e-rr-in" id="rr-'+rid+'" placeholder="不續保原因（選填）">'
      +'<button class="e-save-btn" onclick="saveERow(\''+rid+'\',\''+r.name+'\',\''+r.expiry+'\')">儲存</button>'
      +'</div>'
      +'<button class="e-edit-btn" style="margin-top:8px;" onclick="openRecEdit(this,\''+encodeURIComponent(JSON.stringify(r))+'\')">編輯保單</button>';
  }
  return '<div class="e-row '+rowCls+'" id="'+rid+'">'
    +'<div class="e-main" onclick="togERow(\''+rid+'\',\''+r.renew+'\')">'
    +'<span class="e-name" style="text-decoration:underline;text-underline-offset:3px;" onclick="event.stopPropagation();goClient(\''+encodeURIComponent(r.name)+'\')">'+displayName+'</span>'
    +plate
    +'<span class="e-type">'+typeStr+'</span>'
    +'<span class="e-days '+daysCls+'">'+daysTxt+'</span>'
    +'<span class="e-prem">'+premium+'</span>'
    +'</div>'
    +'<div class="e-expand" id="ee-'+rid+'" style="display:none;">'
    +expandContent
    +'</div></div>';
}
function togERow(rid,curRenew){
  var exp=document.getElementById('ee-'+rid);
  var isOpen=exp.style.display!=='none';
  document.querySelectorAll('[id^="ee-"]').forEach(function(e){e.style.display='none';});
  var existing=document.getElementById('rec-edit-global');
  if(existing)existing.remove();
  if(!isOpen){
    exp.style.display='block';
    var sel=document.getElementById('rs-'+rid);
    if(sel)sel.value=curRenew||'待確認';
  }
}
async function saveERow(rid,name,oldExpiry){
  var sel=document.getElementById('rs-'+rid);
  var dateIn=document.getElementById('rd-'+rid);
  var rrInput=document.getElementById('rr-'+rid);
  if(!sel)return;
  var renew=sel.value;
  var renewreason=rrInput?rrInput.value.trim():'';
  var newExpiry=(dateIn&&dateIn.value)?dateIn.value:oldExpiry;
  setSb('sl2','更新中...');
  try{
    await fetch(API+'?action=update_renew&name='+encodeURIComponent(name)+'&expiry='+encodeURIComponent(oldExpiry)+'&renew='+encodeURIComponent(renew)+'&renewreason='+encodeURIComponent(renewreason)+'&newExpiry='+encodeURIComponent(newExpiry));
    recs.forEach(function(r){if(r.name===name&&r.expiry===oldExpiry){r.renew=renew;r.renewreason=renewreason;r.expiry=newExpiry;}});
    setSb('sok','已更新續保狀態');
    document.getElementById('ee-'+rid).style.display='none';
    rendS();rendE();updSt();
  }catch(e){setSb('ser','更新失敗，請重試');}
}
function rendE(){
  var mr=recs.filter(function(r){return r.expiry&&new Date(r.expiry).getMonth()+1===selM;});
  mr.sort(function(a,b){return dl(a.expiry)-dl(b.expiry);});
  var active=mr.filter(function(r){return r.renew!=='不續保';});
  var noRenew=mr.filter(function(r){return r.renew==='不續保';});
  var owners={},ownerOrder=[];
  active.forEach(function(r){
    var o=r.owner||'未指定';
    if(!owners[o]){owners[o]=[];ownerOrder.push(o);}
    owners[o].push(r);
  });
  var html='';
  ownerOrder.forEach(function(o){
    html+='<div class="e-section-hdr"><span>'+o+'　共 '+owners[o].length+' 筆</span></div>';
    html+=owners[o].map(function(r){return eHTML(r);}).join('');
  });
  if(noRenew.length){
    html+='<div class="e-section-hdr"><span>不續保　共 '+noRenew.length+' 筆</span></div>';
    html+=noRenew.map(function(r){return eHTML(r);}).join('');
  }
  document.getElementById('elist').innerHTML=html||'<div class="emp">'+selM+'月沒有到期保單</div>';
}

function genMsg(){
  var mr=recs.filter(function(r){return r.expiry&&r.renew!=='不續保'&&new Date(r.expiry).getMonth()+1===selM;});
  if(!mr.length){document.getElementById('rmsg').innerHTML='<div class="emp">沒有資料可產出</div>';return;}
  var bc={};
  mr.forEach(function(r){var c=r.company||'未知';if(!bc[c])bc[c]=[];bc[c].push(r);});
  var html='';
  Object.entries(bc).forEach(function(entry){
    var co=entry[0],list=entry[1];
    // 同一客戶（姓名＋車牌相同）合併成一筆，險種合併顯示
    var merged={},mergedOrder=[];
    list.forEach(function(r){
      var key=r.name+'|'+(r.plate||'');
      if(!merged[key]){merged[key]={r:r,types:[r.type]};mergedOrder.push(key);}
      else if(r.type&&merged[key].types.indexOf(r.type)===-1){merged[key].types.push(r.type);}
    });
    var msg='您好，以下是'+selM+'月份到期需要續保的客戶名單，麻煩提供續保資料，謝謝！\n\n'
      +mergedOrder.map(function(key,i){
        var item=merged[key],r=item.r;
        return (i+1)+'、'+r.name+(r.plate?' / 車牌：'+r.plate:'')+(r.idno?' / 身分證：'+r.idno:'')+' / 險種：'+item.types.join('、');
      }).join('\n');
    html+='<div style="margin-bottom:14px;"><div class="co-label">【'+co+'】</div><div class="msg">'+msg+'</div><button class="cb" onclick="cpMsg(this,\''+encodeURIComponent(msg)+'\')">複製此訊息</button></div>';
  });
  document.getElementById('rmsg').innerHTML=html;
}
function cpMsg(btn,enc){
  navigator.clipboard.writeText(decodeURIComponent(enc)).then(function(){btn.textContent='已複製！';setTimeout(function(){btn.textContent='複製此訊息';},2000);});
}
async function addR(){
  var name=document.getElementById('fn').value.trim(),type=document.getElementById('ftp').value,expiry=getExpiry();
  if(!name||!type||!expiry){alert('請填寫姓名、險種及到期日');return;}
  var idno=document.getElementById('fid').value,phone=document.getElementById('fph').value;
  if(idno&&!/^[A-Za-z][0-9]{9}$/.test(idno)){alert('身分證字號格式錯誤，請確認');return;}
  if(phone&&!/^[0-9]{10}$/.test(phone)){alert('電話應為10碼數字');return;}
  var dup=recs.find(function(r){
    return String(r.name||'').trim()===name && String(r.type||'').trim()===type && normDate(r.expiry)===expiry;
  });
  if(dup){
    document.getElementById('dup-modal-msg').textContent='已有一筆相同的保單：\n\n姓名：'+name+'\n險種：'+type+'\n到期日：'+expiry+'\n\n請確認是否真的要再新增一筆？';
    document.getElementById('dup-modal').style.display='flex';
    pendingRec=buildRec(name,type,expiry,idno,phone);
    var btn=document.getElementById('abtn');btn.disabled=true;btn.textContent='請確認...';
    return;
  }
  var rec=buildRec(name,type,expiry,idno,phone);
  await doAddR(rec);
}
function buildRec(name,type,expiry,idno,phone){
  var dets=[],tot=0,loanbank='';
  if(type==='車險'){
    DET.forEach(function(d){var c=document.getElementById('c'+d);if(c&&c.checked){var p=parseInt(document.getElementById('p'+d).value)||0,a=document.getElementById('a'+d).value||'';dets.push({name:d,premium:p,amount:a});tot+=p;}});
    var co=document.getElementById('c其他車險');
    if(co&&co.checked){var coName=document.getElementById('car-other-name').value.trim()||'其他',coP=parseInt(document.getElementById('car-other-p').value)||0,coA=document.getElementById('car-other-a').value||'';dets.push({name:coName,premium:coP,amount:coA});tot+=coP;}
  }else if(type==='住宅火險'){
    tot=parseInt(document.getElementById('ffire-pr').value)||0;
    loanbank=document.getElementById('ffire-bank').value.trim();
  }else{
    tot=parseInt(document.getElementById('fpr').value)||0;
  }
  var identity=document.getElementById('fi').value;
  var companyname=identity==='公司'?(document.getElementById('fcn').value.trim()||''):'';
  var taxid=identity==='公司'?(document.getElementById('ftx').value.trim()||''):'';
  return {
    action:'add',name:name,idno:idno,birthday:getBirthday(),phone:phone,
    address:document.getElementById('fad').value.trim(),
    plate:document.getElementById('fpl').value.trim(),identity:identity,
    type:type,detail:dets.map(function(x){return x.name;}).join('、'),
    company:document.getElementById('fco').value,premium:tot,
    amount:type==='住宅火險'?document.getElementById('ffire-am').value:(document.getElementById('fam')?document.getElementById('fam').value:''),
    expiry:expiry,renew:document.getElementById('frn').value,
    renewreason:document.getElementById('frnrv').value||'',
    owner:document.getElementById('fow').value,
    note:document.getElementById('fnt').value.trim(),
    totalpremium:tot,cardetails:JSON.stringify(dets),
    othertype:type==='其他'?document.getElementById('fotn').value:'',
    loanbank:loanbank,companyname:companyname,taxid:taxid
  };
}
async function doAddR(rec){
  var btn=document.getElementById('abtn');btn.disabled=true;btn.textContent='儲存中...';
  setSb('sl2','儲存至 Google Sheets...');
  try{
    await fetch(API,{method:'POST',mode:'no-cors',body:JSON.stringify(rec)});
    recs.unshift(rec);setSb('sok','已儲存並同步至 Google Sheets');updSt();
    ['fn','fid','fph','fpl','fad','fnt','fotn','frnrv','fcn','ftx','ffire-pr','ffire-am','ffire-bank'].forEach(function(id){var e=document.getElementById(id);if(e)e.value='';});
    ['ftp','fco'].forEach(function(id){var e=document.getElementById(id);if(e)e.value='';});
    resetDateSelects();
    document.getElementById('frn').value='待確認';
    ['xcar','xfire','xoth','xotn','frnr'].forEach(function(id){document.getElementById(id).style.display='none';});
    initCar();
  }catch(e){setSb('ser','儲存失敗，請重試');}
  btn.disabled=false;btn.textContent='＋ 新增保單';
}
async function delR(name,expiry){
  if(!confirm('確定刪除 '+name+' 的這筆保單？'))return;
  setSb('sl2','刪除中...');
  try{
    await fetch(API,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'delete',name:name,expiry:expiry})});
    recs=recs.filter(function(r){return!(r.name===name&&r.expiry===expiry);});
    setSb('sok','已刪除');rendS();rendE();updSt();
  }catch(e){setSb('ser','刪除失敗，請重試');}
}
